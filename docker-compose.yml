services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "5050:5050"
    volumes:
      - ./backend:/app
    networks:
      - app-network
    environment:
      MONGO_URI: ${MONGO_URI}  # Use environment variable for security

networks:
  app-network:
    driver: bridge
